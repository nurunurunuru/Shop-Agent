<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অ্যাকাউন্ট খুলুন</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="login card"><h2>👋 অ্যাকাউন্ট খুলুন</h2><p class="mut small">এটা প্রথমবারের সেটআপ। এই অ্যাকাউন্টটাই মালিক (Owner)। খোলার পর এই পেজ আর আসবে না, শুধু লগইন আসবে।</p>
<div id="cw" hidden><label>সেটআপ কোড (বিক্রেতা আপনাকে দিয়েছেন)</label><input id="c"></div>
<label>আপনার নাম</label><input id="n"><label>ইমেইল</label><input id="e" type="email"><label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="p" type="password">
<p id="err" style="color:#d93a3a"></p><button id="go" style="width:100%">অ্যাকাউন্ট খুলুন</button></div>
<script>
fetch('/api/auth/state').then(r=>r.json()).then(s=>{if(s.hasUsers)location='/login.html';else if(s.needsCode)document.getElementById('cw').hidden=false});
document.getElementById('go').onclick=async()=>{const r=await fetch('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c.value,name:n.value,email:e.value,password:p.value})});const j=await r.json();if(r.ok)location='/app.html';else err.textContent=j.error};
</script></body></html>
